name: VitalSync CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: kelyan1305/vitalsync
  BACKEND_IMAGE: ghcr.io/kelyan1305/vitalsync/backend
  FRONTEND_IMAGE: ghcr.io/kelyan1305/vitalsync/frontend

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Run unit tests
        working-directory: backend
        run: npm test

  build_and_push:
    runs-on: ubuntu-latest
    needs: lint_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy_staging:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend image
        run: docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Run backend in staging mode
        run: docker run -d --name vitalsync-backend-staging -p 3000:3000 ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo "Health check succeeded."
              exit 0
            fi
            echo "Waiting for backend to be healthy..."
            sleep 3
          done
          echo "Health check failed."
          docker logs vitalsync-backend-staging || true
          exit 1

      - name: Cleanup staging container
        if: always()
        run: docker rm -f vitalsync-backend-staging || true
