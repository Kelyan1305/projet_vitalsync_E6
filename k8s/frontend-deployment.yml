apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitalsync-frontend
  labels:
    app: vitalsync-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vitalsync-frontend
  template:
    metadata:
      labels:
        app: vitalsync-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/example-org/vitalsync/frontend:REPLACE_WITH_COMMIT_SHA
          ports:
            - containerPort: 80
